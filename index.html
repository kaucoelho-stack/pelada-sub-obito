<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pelada de Segunda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#0d1f16;
    --pitch:#153726;
    --pitch-2:#1d4530;
    --line: rgba(242,237,225,0.12);
    --chalk:#f2ede1;
    --chalk-dim:#a9b8ac;
    --flood:#ffc94d;
    --flood-dim:#8a6a2a;
    --red:#e4534b;
    --pos-defesa:#6fa8c9;
    --pos-meio:#a893f2;
    --pos-ataque:#ef6f5c;
    --pos-coringa:#4fd1a5;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,201,77,0.10), transparent 60%),
      linear-gradient(180deg, var(--pitch-dark), #0a1811 100%);
    color:var(--chalk);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    padding-bottom:84px;
  }
  .stripes{
    position:fixed; inset:0; z-index:-1; opacity:0.5;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 40px, transparent 40px 80px);
  }
  h1,h2,h3{font-family:'Bebas Neue',sans-serif; letter-spacing:0.5px; margin:0;}
  .app{max-width:560px;margin:0 auto;padding:0 16px;}

  /* HEADER */
  header.top{
    padding:22px 4px 16px;
    display:flex; align-items:flex-start; justify-content:space-between;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .brand-eyebrow{
    font-size:11px; letter-spacing:2.5px; color:var(--flood); text-transform:uppercase; font-weight:700;
  }
  .brand-title{font-size:34px; line-height:1; color:var(--chalk);}
  .next-monday{
    text-align:right; font-family:'Bebas Neue',sans-serif;
  }
  .next-monday .lbl{font-size:10px; letter-spacing:2px; color:var(--chalk-dim); font-family:'Manrope',sans-serif; font-weight:600; text-transform:uppercase;}
  .next-monday .date{font-size:26px; color:var(--flood);}
  .voter-row{
    display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:13px; color:var(--chalk-dim);
  }
  .voter-row b{color:var(--chalk); font-weight:700;}
  .voter-row button{
    background:none; border:1px solid var(--line); color:var(--chalk-dim); border-radius:20px;
    padding:4px 10px; font-size:12px; cursor:pointer; font-family:'Manrope',sans-serif;
  }
  .voter-row button:hover{border-color:var(--flood); color:var(--flood);}
  .live-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--pos-coringa);
    margin-right:5px; box-shadow:0 0 6px var(--pos-coringa);
  }

  /* TABS (bottom nav) */
  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(10,24,17,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex; justify-content:center;
  }
  nav.tabs .inner{display:flex; max-width:560px; width:100%;}
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--chalk-dim); font-family:'Manrope',sans-serif;
    font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    padding:12px 4px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
    border-top:2px solid transparent;
  }
  nav.tabs button .ic{font-size:18px;}
  nav.tabs button.active{color:var(--flood); border-top-color:var(--flood);}

  /* CARDS generic */
  .card{
    background:linear-gradient(180deg, var(--pitch-2), var(--pitch));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .empty{
    text-align:center; padding:40px 20px; color:var(--chalk-dim);
    border:1px dashed var(--line); border-radius:var(--radius);
  }
  .empty b{display:block; color:var(--chalk); font-family:'Bebas Neue'; font-size:20px; margin-bottom:6px; letter-spacing:0.5px;}

  /* PLAYER FICHA (avaliar tab) */
  .ficha{
    background:linear-gradient(160deg, var(--pitch-2) 0%, var(--pitch) 65%);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:12px; position:relative; overflow:hidden;
    border-top:3px solid var(--pos-color, var(--flood));
  }
  .ficha .row1{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .ficha .who{display:flex; align-items:center; gap:10px; min-width:0;}
  .badge-num{
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue'; font-size:15px; color:var(--pos-color, var(--flood)); flex:none;
  }
  .ficha .name{font-weight:800; font-size:15.5px; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ficha .pos-tag{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--pos-color, var(--flood)); opacity:0.85;
  }
  .ficha .stats{font-size:11px; color:var(--chalk-dim); text-align:right; flex:none;}
  .stars{display:flex; gap:6px; margin-top:10px;}
  .star-wrap{
    position:relative; width:28px; height:28px; font-size:27px; line-height:28px;
    cursor:pointer; user-select:none; flex:none;
  }
  .star-wrap .bg{position:absolute; top:0; left:0; color:rgba(242,237,225,0.22);}
  .star-wrap .fg{position:absolute; top:0; left:0; overflow:hidden; color:var(--flood); white-space:nowrap; width:0%;}
  .star-wrap:active{transform:scale(0.92);}
  .your-note{font-size:11.5px; color:var(--chalk-dim); margin-top:6px;}
  .your-note b{color:var(--flood);}

  /* SEARCH */
  .search{
    width:100%; padding:11px 14px; border-radius:20px; border:1px solid var(--line);
    background:rgba(0,0,0,0.2); color:var(--chalk); font-family:'Manrope'; font-size:14px; margin-bottom:14px;
  }
  .search::placeholder{color:var(--chalk-dim);}

  /* RANKING */
  .rank-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-pos{font-family:'Bebas Neue'; font-size:20px; color:var(--chalk-dim); width:26px; flex:none;}
  .rank-row.top1 .rank-pos{color:var(--flood);}
  .rank-name{flex:1; min-width:0;}
  .rank-name .n{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rank-name .p{font-size:10.5px; color:var(--pos-color); text-transform:uppercase; font-weight:700; letter-spacing:0.4px;}
  .rank-avg{text-align:right; flex:none;}
  .rank-avg .num{font-family:'Bebas Neue'; font-size:22px; color:var(--chalk);}
  .rank-avg .cnt{font-size:10px; color:var(--chalk-dim);}

  /* SORTEIO */
  .btn-primary{
    width:100%; padding:14px; border-radius:12px; border:none; cursor:pointer;
    background:var(--flood); color:#241a05; font-family:'Bebas Neue'; font-size:18px; letter-spacing:1px;
  }
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed;}
  .size-toggle{display:flex; gap:8px; margin-bottom:14px;}
  .size-toggle button{
    flex:1; padding:11px; border-radius:10px; border:1px solid var(--line);
    background:none; color:var(--chalk-dim); font-family:'Manrope'; font-weight:700; font-size:13px; cursor:pointer;
  }
  .size-toggle button.active{background:var(--flood); color:#241a05; border-color:var(--flood);}
  .btn-secondary{
    width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); cursor:pointer;
    background:none; color:var(--chalk-dim); font-family:'Manrope'; font-weight:700; font-size:13px; margin-top:8px;
  }
  .team{border-radius:var(--radius); margin-bottom:14px; overflow:hidden; border:1px solid var(--line);}
  .team-head{
    padding:12px 16px; display:flex; justify-content:space-between; align-items:baseline;
    background:rgba(255,255,255,0.03);
  }
  .team-head .t-name{font-family:'Bebas Neue'; font-size:20px; letter-spacing:0.5px;}
  .team-head .t-avg{font-size:11px; color:var(--chalk-dim);}
  .team-players{padding:6px 16px 12px;}
  .team-player{display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13.5px; border-bottom:1px solid var(--line);}
  .team-player:last-child{border-bottom:none;}
  .team-player .tp-pos{font-size:9.5px; text-transform:uppercase; font-weight:800; letter-spacing:0.4px; color:var(--pos-color); margin-right:8px;}
  .team-player .tp-avg{color:var(--chalk-dim); font-size:12px;}
  .draw-meta{font-size:11.5px; color:var(--chalk-dim); text-align:center; margin:-2px 0 14px;}

  /* JOGADORES tab */
  .form-row{display:flex; gap:8px; margin-bottom:10px;}
  .form-row input, .form-row select{
    padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:rgba(0,0,0,0.2); color:var(--chalk); font-family:'Manrope'; font-size:14px;
  }
  .form-row input{flex:1; min-width:0;}
  .form-row select{flex:none; width:118px;}
  .manage-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);}
  .manage-row:last-child{border-bottom:none;}
  .manage-row .m-name{flex:1; font-weight:700; font-size:14px;}
  .manage-row .m-pos{font-size:10px; text-transform:uppercase; font-weight:700; color:var(--pos-color); letter-spacing:0.4px;}
  .del-btn{background:none;border:none; color:var(--red); font-size:18px; cursor:pointer; padding:4px 6px;}
  .edit-btn{background:none;border:none; color:var(--chalk-dim); font-size:16px; cursor:pointer; padding:4px 6px;}
  .edit-btn:hover{color:var(--flood);}

  /* MODAL */
  .modal-bg{
    position:fixed; inset:0; background:rgba(6,14,10,0.75); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:linear-gradient(160deg, var(--pitch-2), var(--pitch-dark));
    border:1px solid var(--line); border-radius:16px; padding:26px 22px; max-width:340px; width:100%;
  }
  .modal h2{font-size:24px; margin-bottom:6px;}
  .modal p{font-size:13.5px; color:var(--chalk-dim); margin:0 0 16px;}
  .modal input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:rgba(0,0,0,0.25); color:var(--chalk); font-family:'Manrope'; font-size:15px; margin-bottom:14px;
  }
  .section-title{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--chalk-dim); font-weight:700; margin:4px 0 10px;}
  .loading{text-align:center; padding:60px 20px; color:var(--chalk-dim); font-size:14px;}
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--flood); color:#241a05; padding:9px 18px; border-radius:20px;
    font-weight:700; font-size:13px; z-index:200; opacity:0; pointer-events:none; transition:opacity 0.25s;
  }
  .toast.show{opacity:1;}
  .toast.error{background:var(--red); color:#2a0a08;}
  .config-error{
    max-width:520px; margin:60px auto; padding:24px; border:1px solid var(--line);
    border-radius:var(--radius); background:var(--pitch-2);
  }
  .config-error code{background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:4px; font-size:12.5px;}
</style>
</head>
<body>
<div class="stripes"></div>
<div class="app" id="app">
  <div class="loading">Carregando a pelada…</div>
</div>
<nav class="tabs" id="tabs" style="display:none;">
  <div class="inner">
    <button data-tab="avaliar" class="active"><span class="ic">⭐</span>Avaliar</button>
    <button data-tab="ranking"><span class="ic">📊</span>Ranking</button>
    <button data-tab="sorteio"><span class="ic">🎽</span>Sortear</button>
    <button data-tab="jogadores"><span class="ic">👥</span>Elenco</button>
  </div>
</nav>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDIC4U3o7c1HDQP9BCvNby5u5WBGz0UxIo",
  authDomain: "pelada-segunda.firebaseapp.com",
  projectId: "pelada-segunda",
  storageBucket: "pelada-segunda.firebasestorage.app",
  messagingSenderId: "456284842113",
  appId: "1:456284842113:web:799cbe1dd8f4988eb5c580"
};
</script>

<script>
const POSITIONS = [
  {key:'Defesa',  color:'var(--pos-defesa)',  short:'DEF'},
  {key:'Meio',    color:'var(--pos-meio)',    short:'MEI'},
  {key:'Ataque',  color:'var(--pos-ataque)',  short:'ATA'},
  {key:'Coringa', color:'var(--pos-coringa)', short:'CORINGA'},
];
const posInfo = (key) => POSITIONS.find(p=>p.key===key) || POSITIONS[3];

let state = {
  voter: null,        // {id, name} — guardado no localStorage deste navegador
  players: [],         // [{id, name, position}]
  votes: {},           // {playerId: {voterId: {stars, name, ts}}}
  draw: null,           // {teams:[...], missingSlots, teamSize, ts}
  tab: 'avaliar',
  search: '',
  teamSize: 6,
};

let db = null;

function uid(){ return 'v_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ---------- voter (identidade local, por navegador) ---------- */
function getVoter(){
  try{
    const raw = localStorage.getItem('pelada_voter');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveVoter(v){
  try{ localStorage.setItem('pelada_voter', JSON.stringify(v)); }catch(e){}
}

/* ---------- modais (substituem prompt/confirm, que ficam bloqueados em iframes) ---------- */
function showEditPlayerModal(player){
  return new Promise(resolve=>{
    const wrap = document.createElement('div');
    wrap.className = 'modal-bg';
    wrap.innerHTML = `
      <div class="modal">
        <h2>Editar jogador</h2>
        <input id="mName" value="${player.name.replace(/"/g,'&quot;')}" maxlength="40" />
        <select id="mPos" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,0.25); color:var(--chalk); font-family:'Manrope'; font-size:15px; margin-bottom:14px;">
          ${POSITIONS.map(p=>`<option value="${p.key}" ${p.key===player.position?'selected':''}>${p.key}</option>`).join('')}
        </select>
        <div style="display:flex; gap:10px;">
          <button class="btn-secondary" id="mCancel" style="margin-top:0; flex:1;">Cancelar</button>
          <button class="btn-primary" id="mOk" style="flex:1;">Salvar</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const input = wrap.querySelector('#mName');
    setTimeout(()=>{ input.focus(); input.select(); }, 30);
    const cleanup = (val)=>{ wrap.remove(); resolve(val); };
    wrap.querySelector('#mCancel').onclick = ()=> cleanup(null);
    wrap.querySelector('#mOk').onclick = ()=>{
      const name = input.value.trim();
      if(!name) return;
      cleanup({name, position: wrap.querySelector('#mPos').value});
    };
    wrap.onclick = (e)=>{ if(e.target === wrap) cleanup(null); };
  });
}

function showConfirmModal(message){
  return new Promise(resolve=>{
    const wrap = document.createElement('div');
    wrap.className = 'modal-bg';
    wrap.innerHTML = `
      <div class="modal">
        <h2>Confirmar</h2>
        <p>${message}</p>
        <div style="display:flex; gap:10px;">
          <button class="btn-secondary" id="mCancel" style="margin-top:0; flex:1;">Cancelar</button>
          <button class="btn-primary" id="mOk" style="flex:1;">Confirmar</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    wrap.querySelector('#mCancel').onclick = ()=>{ wrap.remove(); resolve(false); };
    wrap.querySelector('#mOk').onclick = ()=>{ wrap.remove(); resolve(true); };
    wrap.onclick = (e)=>{ if(e.target === wrap){ wrap.remove(); resolve(false); } };
  });
}

function showPromptModal(title, defaultValue){
  return new Promise(resolve=>{
    const wrap = document.createElement('div');
    wrap.className = 'modal-bg';
    wrap.innerHTML = `
      <div class="modal">
        <h2>${title}</h2>
        <input id="mInput" value="${(defaultValue||'').replace(/"/g,'&quot;')}" maxlength="30" />
        <div style="display:flex; gap:10px;">
          <button class="btn-secondary" id="mCancel" style="margin-top:0; flex:1;">Cancelar</button>
          <button class="btn-primary" id="mOk" style="flex:1;">Salvar</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const input = wrap.querySelector('#mInput');
    setTimeout(()=>{ input.focus(); input.select(); }, 30);
    const cleanup = (val)=>{ wrap.remove(); resolve(val); };
    wrap.querySelector('#mCancel').onclick = ()=> cleanup(null);
    wrap.querySelector('#mOk').onclick = ()=> cleanup(input.value);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') cleanup(input.value); });
    wrap.onclick = (e)=>{ if(e.target === wrap) cleanup(null); };
  });
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

function nextMonday(){
  const d = new Date();
  const day = d.getDay();
  let add = (1 - day + 7) % 7;
  const target = new Date(d); target.setDate(d.getDate()+add);
  const dd = String(target.getDate()).padStart(2,'0');
  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${dd} ${meses[target.getMonth()]}`;
}

function playerAvg(pid){
  const v = state.votes[pid] || {};
  const entries = Object.values(v);
  if(!entries.length) return {avg:0, count:0, hasVotes:false};
  const avg = entries.reduce((s,e)=>s+e.stars,0)/entries.length;
  return {avg, count:entries.length, hasVotes:true};
}

/* ---------- Firestore: escrita ---------- */
async function addPlayer(name, position){
  await db.collection('players').add({name, position, createdAt: Date.now()});
}
async function updatePlayer(id, name, position){
  await db.collection('players').doc(id).update({name, position});
}
async function deletePlayer(id){
  const batch = db.batch();
  batch.delete(db.collection('players').doc(id));
  const voteDocs = await db.collection('votes').where('playerId','==', id).get();
  voteDocs.forEach(d=> batch.delete(d.ref));
  await batch.commit();
}
async function setVote(playerId, stars){
  await db.collection('votes').doc(`${playerId}__${state.voter.id}`).set({
    playerId, voterId: state.voter.id, voterName: state.voter.name, stars, ts: Date.now()
  });
}
async function saveDraw(teams, missingSlots, teamSize){
  await db.collection('meta').doc('currentDraw').set({teams, missingSlots, teamSize, ts: Date.now()});
}

/* ---------- Firestore: leitura em tempo real ---------- */
function subscribeAll(){
  db.collection('players').onSnapshot(
    snap=>{ state.players = snap.docs.map(d=>({id:d.id, ...d.data()})); if(state.voter) render(); },
    err=>{ showToast('Erro ao carregar elenco: '+err.message, true); }
  );
  db.collection('votes').onSnapshot(
    snap=>{
      const votes = {};
      snap.forEach(d=>{
        const v = d.data();
        if(!votes[v.playerId]) votes[v.playerId] = {};
        votes[v.playerId][v.voterId] = {stars:v.stars, name:v.voterName, ts:v.ts};
      });
      state.votes = votes;
      if(state.voter) render();
    },
    err=>{ showToast('Erro ao carregar notas: '+err.message, true); }
  );
  db.collection('meta').doc('currentDraw').onSnapshot(
    doc=>{ state.draw = doc.exists ? doc.data() : null; if(state.voter) render(); },
    err=>{}
  );
}

function init(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('COLE_AQUI')){
    document.getElementById('app').innerHTML = `
      <div class="config-error">
        <h2 style="margin-bottom:10px;">Falta configurar o Firebase</h2>
        <p style="color:var(--chalk-dim); font-size:14px; line-height:1.6;">
          Abra este arquivo (<code>index.html</code>) e cole as chaves do seu projeto Firebase
          no objeto <code>firebaseConfig</code>, perto do topo do &lt;script&gt;.
          O passo a passo completo está no <code>README.md</code> que veio junto.
        </p>
      </div>`;
    return;
  }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();

  state.voter = getVoter();
  document.getElementById('tabs').style.display = 'flex';
  if(!state.voter || !state.voter.name){
    renderNameModal();
  } else {
    render();
  }
  subscribeAll();
}

function renderNameModal(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="modal-bg">
      <div class="modal">
        <h2>E aí, quem é você?</h2>
        <p>Seu nome aparece nas avaliações que você fizer. Fica salvo só neste navegador.</p>
        <input id="nameInput" placeholder="Seu nome" maxlength="30" />
        <button class="btn-primary" id="saveNameBtn">Entrar na pelada</button>
      </div>
    </div>`;
  document.getElementById('saveNameBtn').onclick = ()=>{
    const val = document.getElementById('nameInput').value.trim();
    if(!val) return;
    state.voter = {id: uid(), name: val};
    saveVoter(state.voter);
    render();
  };
}

    <header class="top">
      <div>
        <div class="brand-eyebrow">Racha semanal</div>
        <h1 class="brand-title">PELADA DE<br>SEGUNDA</h1>
      </div>
      <div class="next-monday">
        <div class="lbl">Próxima</div>
        <div class="date">${nextMonday()}</div>
      </div>
    </header>

      <span class="live-dot"></span>Você é <b>${state.voter.name}</b>

    </div>
  `;
}

function attachHeaderEvents(){
  const b = document.getElementById('editNameBtn');
  if(b) b.onclick = async ()=>{
    const val = await showPromptModal('Seu nome', state.voter.name);
    if(val && val.trim()){

      saveVoter(state.voter);

function renderTabAvaliar(){
  const q = state.search.toLowerCase();
  const list = state.players.filter(p=>p.name.toLowerCase().includes(q));
  let html = `<input class="search" id="searchInput" placeholder="Buscar jogador…" value="${state.search.replace(/"/g,'&quot;')}" />`;
  if(!state.players.length){
    html += `<div class="empty"><b>Elenco vazio</b>Cadastre o pessoal na aba Elenco para começar a avaliar.</div>`;
  } else if(!list.length){
    html += `<div class="empty">Nenhum jogador encontrado.</div>`;
  } else {
    list.forEach(p=>{
      const info = posInfo(p.position);
      const {avg, count, hasVotes} = playerAvg(p.id);
      const myVote = (state.votes[p.id] || {})[state.voter.id];
      const myStars = myVote ? myVote.stars : 0;
      let stars = '';
      for(let i=1;i<=5;i++){
        let pct = 0;
        if(myStars >= i) pct = 100;
        else if(myStars >= i - 0.5) pct = 50;
        stars += `<div class="star-wrap" data-pid="${p.id}" data-star="${i}">
          <span class="bg">★</span>
          <span class="fg" style="width:${pct}%">★</span>
        </div>`;
      }
      html += `
        <div class="ficha" style="--pos-color:${info.color}">
          <div class="row1">
            <div class="who">
              <div class="badge-num">${info.short.slice(0,3)}</div>
              <div>
                <div class="name">${p.name}</div>
                <div class="pos-tag">${p.position}</div>
              </div>
            </div>
            <div class="stats">${hasVotes ? avg.toFixed(1)+' ★' : 'sem notas'}<br>${count} aval.</div>
          </div>
          <div class="stars">${stars}</div>
          ${myVote ? `<div class="your-note">Sua nota: <b>${myVote.stars} ★</b> — toque na estrela para mudar</div>` : `<div class="your-note">Toque na metade esquerda p/ meia nota, direita p/ nota cheia</div>`}
        </div>`;
    });
  }
  return html;
}

function renderTabRanking(){
  if(!state.players.length) return `<div class="empty"><b>Nada para mostrar</b>Cadastre jogadores primeiro.</div>`;
  const rows = state.players.map(p=>{
    const {avg,count,hasVotes} = playerAvg(p.id);
    return {...p, avg, count, hasVotes};
  }).sort((a,b)=>{
    if(a.hasVotes !== b.hasVotes) return a.hasVotes ? -1 : 1;
    return b.avg - a.avg;
  });
  let html = `<div class="section-title">Média geral do elenco</div><div class="card" style="padding:4px 12px;">`;
  rows.forEach((r,i)=>{
    const info = posInfo(r.position);
    html += `
      <div class="rank-row ${i===0 && r.hasVotes ? 'top1':''}">
        <div class="rank-pos">${i+1}</div>
        <div class="rank-name">
          <div class="n">${r.name}</div>
          <div class="p" style="color:${info.color}">${r.position}</div>
        </div>
        <div class="rank-avg">
          <div class="num">${r.hasVotes ? r.avg.toFixed(1) : '–'}</div>
          <div class="cnt">${r.count} aval.</div>
        </div>
      </div>`;
  });
  html += `</div>`;
  return html;
}

function generateTeams(teamSize){
  const withScore = state.players.map(p=>{
    const {avg,hasVotes} = playerAvg(p.id);
    return {...p, avg: hasVotes ? avg : 3};
  });
  const REQUIRED = {Defesa:2, Meio:3, Ataque:1};
  const teams = [
    {name:'Time 1', players:[], sum:0, counts:{Defesa:0,Meio:0,Ataque:0}},
    {name:'Time 2', players:[], sum:0, counts:{Defesa:0,Meio:0,Ataque:0}},
    {name:'Time 3', players:[], sum:0, counts:{Defesa:0,Meio:0,Ataque:0}},
  ];
  const usedIds = new Set();
  const coringaPool = withScore.filter(p=>p.position==='Coringa').sort((a,b)=>b.avg-a.avg);
  let missingSlots = 0;
  const balance = (a,b)=> a.sum - b.sum || a.players.length - b.players.length;
  const assign = (team, pos, player)=>{
    team.players.push(player);
    team.sum += player.avg;
    if(pos) team.counts[pos] += 1;
    usedIds.add(player.id);
  };

  Object.keys(REQUIRED).forEach(pos=>{
    const need = REQUIRED[pos];
    const group = withScore.filter(p=>p.position===pos).sort((a,b)=>b.avg-a.avg);
    let gi = 0;
    while(gi < group.length){
      const needing = teams.filter(t=>t.counts[pos] < need);
      if(!needing.length) break;
      needing.sort(balance);
      assign(needing[0], pos, group[gi++]);
    }
    let needing = teams.filter(t=>t.counts[pos] < need);
    while(needing.length){
      const player = coringaPool.find(p=>!usedIds.has(p.id));
      if(!player) break;
      needing.sort(balance);
      assign(needing[0], pos, player);
      needing = teams.filter(t=>t.counts[pos] < need);
    }
    missingSlots += needing.length;
  });

  if(teamSize === 7){
    const remainingPool = withScore.filter(p=>!usedIds.has(p.id)).sort((a,b)=>b.avg-a.avg);
    let ri = 0;
    let needingExtra = teams.filter(t=>t.players.length < 7);
    while(needingExtra.length && ri < remainingPool.length){
      needingExtra.sort(balance);
      assign(needingExtra[0], null, remainingPool[ri++]);
      needingExtra = teams.filter(t=>t.players.length < 7);
    }
    missingSlots += needingExtra.length;
  }

  return {teams, missingSlots};
}

function renderTabSorteio(){
  let html = '';
  const minNeeded = state.teamSize * 3;
  const enough = state.players.length >= minNeeded;
  html += `<div class="section-title">Jogadores de linha por time</div>`;
  html += `<div class="size-toggle">
    <button class="size-btn ${state.teamSize===6?'active':''}" data-size="6">6 jogadores</button>
    <button class="size-btn ${state.teamSize===7?'active':''}" data-size="7">7 jogadores</button>
  </div>`;
  if(!enough){
    html += `<div class="empty"><b>Elenco insuficiente</b>Cadastre pelo menos ${minNeeded} jogadores de linha (Defesa, Meio, Ataque ou Coringa) para sortear com ${state.teamSize} por time.</div>`;
  }
  html += `<button class="btn-primary" id="drawBtn" ${!enough?'disabled':''}>SORTEAR OS 3 TIMES</button>`;
  html += `<div class="draw-meta" style="margin-top:8px;">Goleiros são fixos e não entram no sorteio. Formação: 2 Defesa, 3 Meio, 1 Ataque${state.teamSize===7 ? ' + 1 curinga de qualquer posição' : ''} por time.</div>`;
  if(state.draw && state.draw.teams){
    const d = new Date(state.draw.ts);
    html += `<div class="draw-meta">Último sorteio: ${d.toLocaleDateString('pt-BR')} às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>`;
    if(state.draw.missingSlots > 0){
      html += `<div class="draw-meta" style="color:var(--red);">Faltaram jogadores para preencher todas as vagas (${state.draw.missingSlots} vaga(s) em aberto). Cadastre mais gente em Defesa/Meio/Ataque/Coringa.</div>`;
    }
    state.draw.teams.forEach(t=>{
      html += `<div class="team">
        <div class="team-head"><span class="t-name">${t.name}</span><span class="t-avg">força média: ${(t.sum/(t.players.length||1)).toFixed(1)} ★</span></div>
        <div class="team-players">`;
      t.players.forEach(p=>{
        const info = posInfo(p.position);
        html += `<div class="team-player">
          <span><span class="tp-pos" style="color:${info.color}">${info.short}</span>${p.name}</span>
          <span class="tp-avg">${p.avg.toFixed(1)} ★</span>
        </div>`;
      });
      html += `</div></div>`;
    });
  }
  return html;
}

function renderTabJogadores(){
  let html = `
    <div class="section-title">Adicionar jogador</div>
    <div class="card">
      <div class="form-row">
        <input id="newPlayerName" placeholder="Nome do jogador" maxlength="40" />
        <select id="newPlayerPos">
          ${POSITIONS.map(p=>`<option value="${p.key}">${p.key}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary" id="addPlayerBtn">ADICIONAR AO ELENCO</button>
    </div>
    <div class="section-title">Elenco (${state.players.length})</div>
    <div class="card" style="padding:4px 12px;">`;
  if(!state.players.length){
    html += `<div style="padding:16px 0; color:var(--chalk-dim); text-align:center;">Ninguém cadastrado ainda.</div>`;
  } else {
    state.players.forEach(p=>{
      const info = posInfo(p.position);
      html += `<div class="manage-row">
        <div class="m-name">${p.name}</div>
        <div class="m-pos" style="color:${info.color}">${p.position}</div>
        <button class="edit-btn" data-editid="${p.id}" title="Editar jogador">✎</button>
        <button class="del-btn" data-delid="${p.id}">✕</button>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

function render(){
  const app = document.getElementById('app');
  let body = '';
  if(state.tab === 'avaliar') body = renderTabAvaliar();
  else if(state.tab === 'ranking') body = renderTabRanking();
  else if(state.tab === 'sorteio') body = renderTabSorteio();
  else body = renderTabJogadores();

  app.innerHTML = renderHeader() + body;
  attachHeaderEvents();

  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
    b.onclick = ()=>{ state.tab = b.dataset.tab; render(); };
  });

  if(state.tab === 'avaliar'){
    const si = document.getElementById('searchInput');
    if(si){
      si.oninput = (e)=>{ state.search = e.target.value; render(); si_focus(); };
    }
    document.querySelectorAll('.star-wrap').forEach(el=>{
      el.onclick = async (e)=>{
        const pid = el.dataset.pid;
        const starIndex = parseInt(el.dataset.star,10);
        const rect = el.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const isLeftHalf = clickX < rect.width / 2;
        const value = isLeftHalf ? starIndex - 0.5 : starIndex;
        try{
          await setVote(pid, value);
          showToast('Nota salva!');
        }catch(err){
          showToast('Erro ao salvar: '+err.message, true);
        }
      };
    });
  }

  if(state.tab === 'sorteio'){
    document.querySelectorAll('.size-btn').forEach(b=>{
      b.onclick = ()=>{ state.teamSize = parseInt(b.dataset.size,10); render(); };
    });
    const btn = document.getElementById('drawBtn');
    if(btn){
      btn.onclick = async ()=>{
        const {teams, missingSlots} = generateTeams(state.teamSize);
        try{
          await saveDraw(teams, missingSlots, state.teamSize);
          showToast('Times sorteados!');
        }catch(err){
          showToast('Erro ao salvar sorteio: '+err.message, true);
        }
      };
    }
  }

  if(state.tab === 'jogadores'){
    const addBtn = document.getElementById('addPlayerBtn');
    if(addBtn){
      addBtn.onclick = async ()=>{
        const nameEl = document.getElementById('newPlayerName');
        const posEl = document.getElementById('newPlayerPos');
        const name = nameEl.value.trim();
        if(!name) return;
        try{
          await addPlayer(name, posEl.value);
          showToast('Jogador adicionado!');
        }catch(err){
          showToast('Erro ao salvar: '+err.message, true);
        }
      };
    }
    document.querySelectorAll('.edit-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.editid;
        const p = state.players.find(x=>x.id===id);
        if(!p) return;
        const result = await showEditPlayerModal(p);
        if(result){
          try{
            await updatePlayer(id, result.name, result.position);
            showToast('Jogador atualizado!');
          }catch(err){
            showToast('Erro ao salvar: '+err.message, true);
          }
        }
      };
    });
    document.querySelectorAll('.del-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.delid;
        const p = state.players.find(x=>x.id===id);
        if(!(await showConfirmModal(`Remover <b>${p ? p.name : 'este jogador'}</b> do elenco?`))) return;
        try{
          await deletePlayer(id);
          showToast('Jogador removido.');
        }catch(err){
          showToast('Erro ao remover: '+err.message, true);
        }
      };
    });
  }
}

function si_focus(){
  const si = document.getElementById('searchInput');
  if(si){ si.focus(); si.selectionStart = si.selectionEnd = si.value.length; }
}

init();
</script>
